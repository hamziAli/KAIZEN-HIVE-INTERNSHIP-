<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 1: Semantic HTML Structure</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; color: #333; }

    header {
      background: #1F3864;
      color: #fff;
      padding: 20px 40px;
    }
    header h1 { font-size: 24px; }

    nav {
      background: #2e75b6;
      padding: 12px 40px;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      margin-right: 24px;
      font-size: 15px;
    }
    nav a:hover { text-decoration: underline; }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 40px;
    }

    section {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 28px;
      margin-bottom: 24px;
    }
    section h2 { color: #1F3864; margin-bottom: 12px; }
    section p  { color: #555; line-height: 1.6; }

    footer {
      background: #1F3864;
      color: #ccc;
      text-align: center;
      padding: 16px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>My Website</h1>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>

  <main>
    <section>
      <h2>Services</h2>
      <p>We offer a wide range of web development services including design, development, and deployment.</p>
    </section>
  </main>

  <footer>
    <p>&copy; Copyright My Website. All rights reserved.</p>
  </footer>

</body>
</html>
